name: Zbuduj samodzielny EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zainstaluj zaleznosci
        run: npm install

      - name: Zbuduj aplikacje EXE
        run: npm run dist

      - name: Udostepnij EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Excel-Signer-Portable
          path: dist/*.exe
          if-no-files-found: error
